<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>World concepts (rough mock) | ArchiWatts</title>
<style>
  :root{--bg:#141518;--panel:#1d1e23;--line:#34363d;--text:#f3f2ef;--dim:#a4a6ad;--pink:#e8457a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Segoe UI",Helvetica,Arial,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .ui{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  #top{top:12px;left:50%;transform:translateX(-50%);padding:10px 12px;width:min(760px,calc(100vw - 24px));text-align:center}
  #top small{display:block;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-bottom:8px}
  #tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  button{font:inherit;color:var(--text);background:#26282e;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:#6a6d76}
  button[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
  #desc{margin:8px 0 0;color:var(--dim);font-size:13px;text-wrap:balance}
  #list{top:132px;left:12px;width:190px;padding:10px;max-height:calc(100vh - 220px);overflow:auto}
  #list h2,#card h2{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
  #list button{display:block;width:100%;text-align:left;margin:0 0 4px;padding:6px 9px;font-size:13px}
  #list button.on{background:#fff;color:#111;border-color:#fff;font-weight:600}
  #card{top:132px;right:12px;width:250px;padding:12px}
  #card img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#0e0f11;display:block;margin-bottom:10px}
  #card h3{margin:0 0 10px;font-size:18px}
  #card a{display:block;text-align:center;background:var(--pink);color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:9px;margin-bottom:6px}
  #card button{width:100%}
  #modes{bottom:14px;left:50%;transform:translateX(-50%);padding:8px;display:flex;gap:6px;align-items:center}
  #hint{color:var(--dim);font-size:12px;padding:0 8px;max-width:46vw}
  #found{bottom:76px;left:50%;transform:translateX(-50%);padding:10px 14px;display:flex;gap:12px;align-items:center;border-color:var(--pink)}
  #found b{font-size:15px}
  [hidden]{display:none!important}
  @media (max-width:760px){#list{display:none}#card{top:auto;bottom:76px;right:12px;left:12px;width:auto}#card img{display:none}#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="ui">
  <small>ArchiWatts · one world, all projects · rough concept mock</small>
  <div id="tabs"></div>
  <p id="desc"></p>
</div>

<div id="list" class="ui"><h2>Find a project</h2></div>

<div id="card" class="ui" hidden>
  <h2>Selected</h2>
  <img id="cimg" alt="">
  <h3 id="cname"></h3>
  <a id="copen" href="#">Open project →</a>
  <button id="cback" type="button">Back to the world</button>
</div>

<div id="found" class="ui" hidden><span>You found <b id="fname"></b></span><button id="fopen" type="button">Look closer</button></div>

<div id="modes" class="ui">
  <button id="mOrbit" type="button" aria-pressed="true">Orbit</button>
  <button id="mWalk" type="button" aria-pressed="false">Walk</button>
  <span id="hint"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const P = [
    {name:'Hive', kind:'hex', url:'../Hive/Hive.html', img:'../portfolio-assets/hive-card-model.webp'},
    {name:'Phalanstery', kind:'slab', url:'../Phalanstery/Phalanstery.html', img:'../img/Phalanstery/renders/best-render-phalanstery-17.webp'},
    {name:'Tranquil River', kind:'river', url:'../Tranquil-River/Tranquil-River.html', img:'../portfolio-assets/tranquil-river-card-model.webp'},
    {name:'Net Zero School', kind:'school', url:'../Net-Zero-School/Net-Zero-School.html', img:'../portfolio-assets/net-zero-school-review-cover.png'},
    {name:'Venice Apartments', kind:'court', url:'../interactive/venice-apartments/index.html', img:'../interactive/venice-apartments/preview.webp'},
    {name:'Allure Waterways', kind:'allure', url:'../interactive/allure-waterways/index.html', img:'../interactive/allure-waterways/preview.webp'},
    {name:'Museum of Emotions', kind:'blob', url:'../interactive/museum-of-emotions/index.html', img:'../interactive/museum-of-emotions/preview.webp'},
    {name:'Cantilever Barn', kind:'barn', url:'../interactive/east-tennessee-cantilever-barn/index.html', img:'../interactive/east-tennessee-cantilever-barn/preview.webp'},
    {name:'Winter Station 2027', kind:'pavilion', url:'../interactive/winter-station-2027/index.html', img:'../interactive/winter-station-2027/preview.webp'},
    {name:'Wheels on Water', kind:'boatbig', url:'../interactive/wheels-on-water/index.html', img:'../interactive/wheels-on-water/preview.webp'},
    {name:'North Beach Youth Center', kind:'lshape', url:'../interactive/north-beach-youth-center/index.html', img:'../interactive/north-beach-youth-center/preview.webp'},
    {name:'Bench Boat', kind:'boat', url:'../interactive/bench-boat/index.html', img:'../interactive/bench-boat/preview.webp'},
    {name:'Bench D9', kind:'bench', url:'../interactive/bench-d9/index.html', img:'../interactive/bench-d9/preview.webp'}
  ];
  const SMALL = {boat:1, bench:1};

  const CONCEPTS = {
    arch: {
      tab:'A · Archipelago',
      desc:'Each project is its own island in one lagoon, linked by bridges. Water projects sit in the middle. You can cross from one to the next and stumble on them.',
      bg:0xa9c3d1, fog:[0xa9c3d1,260,620], start:[0,15], r:210,
      pos:[[-70,8],[62,-52],[-14,40],[-36,-26],[0,0],[38,-22],[72,6],[-52,48],[-8,-58],[30,30],[8,78],[-30,12],[52,50]]
    },
    table: {
      tab:'B · Model table',
      desc:'The world is a studio table of scale models, one plot per project, with empty plots waiting for future work. Orbit it like a site model, or shrink down and walk across it.',
      bg:0x17181c, fog:null, start:[0,58], r:230,
      pos:Array.from({length:13},(_,i)=>[(i%5-2)*38,(Math.floor(i/5)-1)*36])
    },
    circuit: {
      tab:'C · Circuit board',
      desc:'The world grows out of the ArchiWatts logo: a board where every trace leads to a project. The pink node is where you start, and the traces are the paths you walk.',
      bg:0x0f1013, fog:null, start:[-88,0], r:230,
      pos:Array.from({length:13},(_,i)=>{const hx=-72+i*12,s=i%2?1:-1;return [hx+8*s, s*(34+((i>>1)%2)*22)]})
    }
  };

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50,1,.5,1500);
  scene.add(new THREE.HemisphereLight(0xffffff,0x7c828c,.62));
  const sun = new THREE.DirectionalLight(0xffffff,.5); sun.position.set(90,150,70); sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-170,right:170,top:170,bottom:-170,near:10,far:500}); scene.add(sun);

  const clay = new THREE.MeshStandardMaterial({color:0xf3f1ec, roughness:.92});
  const mat = c => new THREE.MeshStandardMaterial({color:c, roughness:.95});
  const hitMat = new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false});

  function mass(kind){
    const g = new THREE.Group(); let h = 8;
    const add = (geo,x,y,z) => { const m = new THREE.Mesh(geo,clay); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; g.add(m); return m; };
    const b = (w,hh,d,x=0,z=0,y=0,ry=0) => { const m = add(new THREE.BoxGeometry(w,hh,d),x,y+hh/2,z); m.rotation.y = ry; return m; };
    const hip = (w,d,hh,x,z,y) => { const geo = new THREE.ConeGeometry(.72,1,4); geo.rotateY(Math.PI/4); const m = add(geo,x,y+hh/2,z); m.scale.set(w,hh,d); return m; };
    const hull = (l,hh,w,y) => { const m = add(new THREE.SphereGeometry(1,20,12),0,y,0); m.scale.set(l,hh,w); return m; };
    switch(kind){
      case 'court': b(14,9,3,0,-5.5); b(14,9,3,0,5.5); b(3,9,8,-5.5,0); b(3,9,8,5.5,0); hip(15,4,2.5,0,-5.5,9); hip(15,4,2.5,0,5.5,9); h=12; break;
      case 'hex': [[0,0,14],[5.2,0,9],[-5.2,0,11],[2.6,4.5,7],[-2.6,4.5,12],[2.6,-4.5,10],[-2.6,-4.5,6]].forEach(([x,z,hh])=>add(new THREE.CylinderGeometry(3,3,hh,6),x,hh/2,z)); h=14; break;
      case 'slab': b(22,7,4,0,-4); b(4,7,10,-9,3); b(4,7,10,9,3); b(6,11,5,0,-4); h=11; break;
      case 'river': b(24,.6,5,0,0,0,.3); b(3,3,3,-7,-1); b(4,2.5,3,5,3); h=4; break;
      case 'school': b(18,5,5,0,-4); b(18,5,5,2,4); b(14,.5,3,0,0,2.4).rotation.z=.25; h=7; break;
      case 'blob': b(8,8,8,0,0,0,.4); b(6,12,6,4,3,0,-.3); b(7,5,9,-5,-2,0,.9); h=12; break;
      case 'barn': b(6,4,5); b(13,4,9,0,0,4); hip(14,10,4,0,0,8); h=12; break;
      case 'pavilion': add(new THREE.ConeGeometry(4.5,7,5,1,true),0,3.5,0).material = new THREE.MeshStandardMaterial({color:0xf3f1ec,roughness:.92,side:THREE.DoubleSide}); h=7; break;
      case 'boatbig': hull(8,1.6,3,1); b(8,2.5,3.5,0,0,1.5); h=5; break;
      case 'lshape': b(16,6,6,0,-4); b(6,6,12,-5,3); b(18,.6,8,1,-4,6); h=7; break;
      case 'allure': b(20,.5,4,0,0,0,.2); b(5,4,5,-6,-5); b(6,6,4,5,5); h=6; break;
      case 'boat': hull(4,1,1.6,.8); b(3,.4,1.4,0,0,1.4); g.scale.setScalar(1.6); h=4; break;
      case 'bench': b(5,.5,1.6,0,0,.8); b(.5,.8,1.6,-2,0); b(.5,.8,1.6,2,0); b(5,1.2,.3,0,-.7,1.3); g.scale.setScalar(1.6); h=4; break;
    }
    g.userData.h = h; return g;
  }

  function label(text, dim){
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 112; const x = cv.getContext('2d');
    x.font = '600 44px system-ui,Segoe UI,Arial'; const w = Math.min(500, x.measureText(text).width + 56), l = (512-w)/2;
    x.fillStyle = dim ? 'rgba(60,62,70,.85)' : 'rgba(20,21,24,.92)'; x.beginPath();
    x.moveTo(l+28,12); x.arcTo(l+w,12,l+w,100,28); x.arcTo(l+w,100,l,100,28); x.arcTo(l,100,l,12,28); x.arcTo(l,12,l+w,12,28); x.fill();
    x.fillStyle = dim ? '#c9cbd1' : '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text,256,58,480);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv), depthTest:false, transparent:true}));
    s.scale.set(26,5.7,1); s.renderOrder = 10; return s;
  }

  const world = new THREE.Group(), projects = new THREE.Group(); scene.add(world, projects);
  const ring = new THREE.Mesh(new THREE.RingGeometry(15,16.2,64), new THREE.MeshBasicMaterial({color:0xe8457a, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2; ring.visible = false; scene.add(ring);

  const flat = (geo,color,x,y,z) => { const m = new THREE.Mesh(geo,mat(color)); m.position.set(x,y,z); m.receiveShadow = true; world.add(m); return m; };
  function seg(a,b,w,color,y){ const dx=b[0]-a[0], dz=b[1]-a[1]; const m = flat(new THREE.BoxGeometry(Math.hypot(dx,dz),.5,w),color,(a[0]+b[0])/2,y,(a[1]+b[1])/2); m.rotation.y = -Math.atan2(dz,dx); return m; }

  const BUILD = {
    arch(pos){
      const water = flat(new THREE.PlaneGeometry(1600,1600),0x6f9bb3,0,-2.4,0); water.rotation.x = -Math.PI/2;
      pos.forEach((p,i) => {
        if (P[i].kind !== 'boat') { const r = SMALL[P[i].kind] ? 8 : 17; flat(new THREE.CylinderGeometry(r,r*1.1,3,48),0xecebe5,p[0],-1.5,p[1]); }
        if (i) { let j = 0, best = 1e9; for (let k=0;k<i;k++){ const d = Math.hypot(p[0]-pos[k][0],p[1]-pos[k][1]); if (d<best){best=d;j=k;} } seg(p,pos[j],3,0xffffff,-.45); }
      });
    },
    table(pos){
      flat(new THREE.BoxGeometry(215,4,135),0xf4f2ee,0,-2.02,0).castShadow = true;
      [[-98,-58],[98,-58],[-98,58],[98,58]].forEach(([x,z]) => flat(new THREE.BoxGeometry(6,56,6),0x2b2d33,x,-32,z));
      const floor = flat(new THREE.PlaneGeometry(1600,1600),0x202126,0,-60,0); floor.rotation.x = -Math.PI/2;
      for (let i=0;i<15;i++){
        const x=(i%5-2)*38, z=(Math.floor(i/5)-1)*36, pts=[[-16,-15],[16,-15],[16,15],[-16,15],[-16,-15]].map(([a,c])=>new THREE.Vector3(x+a,.06,z+c));
        world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:i<13?0x8d8f96:0xc4c5ca})));
        if (i>=13){ const s = label('Future project',true); s.position.set(x,5,z); world.add(s); }
      }
    },
    circuit(pos){
      const board = flat(new THREE.CylinderGeometry(124,124,3,6),0x1d1e23,0,-1.52,0); board.rotation.y = 0;
      seg([-92,0],[84,0],1.6,0xffffff,.15);
      pos.forEach((p,i) => {
        const hx = -72+i*12, sgn = Math.sign(p[1]), k = [hx, p[1]-sgn*Math.abs(p[0]-hx)];
        seg([hx,0],k,1.2,0xffffff,.15); seg(k,p,1.2,0xffffff,.15);
        const n = new THREE.Mesh(new THREE.TorusGeometry(2.2,.55,8,28), new THREE.MeshBasicMaterial({color:0xffffff})); n.rotation.x = Math.PI/2; n.position.set(hx,.5,0); world.add(n);
        const pad = new THREE.Mesh(new THREE.RingGeometry(12.2,13,56), new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide})); pad.rotation.x = -Math.PI/2; pad.position.set(p[0],.12,p[1]); world.add(pad);
      });
      const you = new THREE.Mesh(new THREE.SphereGeometry(3.4,24,16), new THREE.MeshBasicMaterial({color:0xe8457a})); you.position.set(-92,2,0); world.add(you);
    }
  };

  let concept = 'arch', mode = 'orbit', selected = -1;
  const o = {th:.9, ph:.95, r:210, t:new THREE.Vector3()}, g = {th:.9, ph:.95, r:210, t:new THREE.Vector3()};
  const walk = {pos:new THREE.Vector3(), yaw:0, pitch:0}, keys = {};
  const $ = id => document.getElementById(id);

  function setConcept(id){
    concept = id; const C = CONCEPTS[id];
    while (world.children.length) world.remove(world.children[0]);
    while (projects.children.length) projects.remove(projects.children[0]);
    scene.background = new THREE.Color(C.bg); scene.fog = C.fog ? new THREE.Fog(...C.fog) : null;
    BUILD[id](C.pos);
    P.forEach((p,i) => {
      const m = mass(p.kind), grp = new THREE.Group(); grp.add(m);
      const s = label(p.name); s.position.y = m.userData.h + 6; grp.add(s);
      const hit = new THREE.Mesh(new THREE.CylinderGeometry(10,10,m.userData.h+4,12),hitMat); hit.position.y = (m.userData.h+4)/2; grp.add(hit);
      grp.position.set(C.pos[i][0], id==='arch' && p.kind==='boat' ? -2.2 : 0, C.pos[i][1]); grp.userData.pi = i; projects.add(grp);
    });
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id===id));
    $('desc').textContent = C.desc; select(-1); if (mode==='walk') startWalk();
  }

  function select(i){
    selected = i;
    document.querySelectorAll('#list button').forEach((b,k) => b.classList.toggle('on', k===i));
    $('card').hidden = i<0; ring.visible = i>=0;
    if (i<0){ g.t.set(0,0,0); g.r = CONCEPTS[concept].r; g.ph = .95; return; }
    const p = P[i], pos = projects.children[i].position;
    $('cname').textContent = p.name; $('copen').href = p.url; const im = $('cimg'); im.hidden = false; im.onerror = () => im.hidden = true; im.src = p.img;
    ring.position.set(pos.x,.3,pos.z); ring.scale.setScalar(SMALL[p.kind] ? .55 : 1);
    if (mode==='walk') setMode('orbit');
    g.t.set(pos.x,3,pos.z); g.r = SMALL[p.kind] ? 34 : 52; g.ph = 1.1;
  }

  function startWalk(){ const s = CONCEPTS[concept].start; walk.pos.set(s[0],1.8,s[1]); walk.yaw = Math.atan2(s[0],s[1]); walk.pitch = 0; }
  function setMode(m){
    mode = m; $('mOrbit').setAttribute('aria-pressed', m==='orbit'); $('mWalk').setAttribute('aria-pressed', m==='walk');
    $('hint').textContent = m==='orbit' ? 'Drag to orbit · scroll to zoom · click a project' : 'W A S D or arrow keys to move · drag to look · Shift to run';
    $('found').hidden = true;
    if (m==='walk'){ select(-1); mode = 'walk'; startWalk(); } else { o.th = g.th; o.ph = .5; o.r = 320; }
  }

  // UI
  Object.entries(CONCEPTS).forEach(([id,C]) => { const b = document.createElement('button'); b.type='button'; b.textContent = C.tab; b.dataset.id = id; b.onclick = () => setConcept(id); $('tabs').appendChild(b); });
  P.forEach((p,i) => { const b = document.createElement('button'); b.type='button'; b.textContent = p.name; b.onclick = () => select(i); $('list').appendChild(b); });
  $('cback').onclick = () => select(-1); $('mOrbit').onclick = () => setMode('orbit'); $('mWalk').onclick = () => setMode('walk');
  let near = -1; $('fopen').onclick = () => { if (near>=0) select(near); };

  // Pointer and keys
  let down = null, moved = 0; const ray = new THREE.Raycaster(), v2 = new THREE.Vector2();
  canvas.addEventListener('pointerdown', e => { down = [e.clientX,e.clientY]; moved = 0; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!down) return; const dx = e.clientX-down[0], dy = e.clientY-down[1]; down = [e.clientX,e.clientY]; moved += Math.abs(dx)+Math.abs(dy);
    if (mode==='orbit'){ g.th += dx*.006; g.ph = Math.min(1.48, Math.max(.15, g.ph - dy*.005)); }
    else { walk.yaw -= dx*.004; walk.pitch = Math.min(1.2, Math.max(-1.2, walk.pitch - dy*.004)); }
  });
  canvas.addEventListener('pointerup', e => {
    if (down && moved<6){
      v2.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(v2,camera);
      const hit = ray.intersectObjects(projects.children,true)[0]; let n = hit && hit.object;
      while (n && n.userData.pi===undefined) n = n.parent; select(n ? n.userData.pi : -1);
    }
    down = null;
  });
  canvas.addEventListener('wheel', e => { e.preventDefault(); if (mode==='orbit') g.r = Math.min(360, Math.max(22, g.r*(1+Math.sign(e.deltaY)*.12))); }, {passive:false});
  addEventListener('keydown', e => { keys[e.code] = true; if (e.code==='Escape') select(-1); });
  addEventListener('keyup', e => keys[e.code] = false);

  function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  let last = performance.now();
  function frame(now){
    const dt = Math.min(.05,(now-last)/1000); last = now;
    if (mode==='orbit'){
      const k = 1-Math.exp(-dt*5); o.th += (g.th-o.th)*k; o.ph += (g.ph-o.ph)*k; o.r += (g.r-o.r)*k; o.t.lerp(g.t,k);
      camera.position.set(o.t.x+o.r*Math.sin(o.ph)*Math.cos(o.th), o.t.y+o.r*Math.cos(o.ph), o.t.z+o.r*Math.sin(o.ph)*Math.sin(o.th)); camera.lookAt(o.t);
    } else {
      const f = (keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), s = (keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
      const sp = (keys.ShiftLeft||keys.ShiftRight?34:15)*dt, sy = Math.sin(walk.yaw), cy = Math.cos(walk.yaw);
      walk.pos.x += (-sy*f + cy*s)*sp; walk.pos.z += (-cy*f - sy*s)*sp;
      camera.position.copy(walk.pos); camera.rotation.set(walk.pitch,walk.yaw,0,'YXZ');
      near = -1; let best = 24; projects.children.forEach((c,i) => { const d = Math.hypot(c.position.x-walk.pos.x, c.position.z-walk.pos.z); if (d<best){best=d;near=i;} });
      $('found').hidden = near<0; if (near>=0) $('fname').textContent = P[near].name;
    }
    renderer.render(scene,camera); requestAnimationFrame(frame);
  }
  setConcept('arch'); setMode('orbit'); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
