<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>World with real models (mock 3) | ArchiWatts</title>
<style>
  :root{--bg:#141518;--panel:#1d1e23;--line:#34363d;--text:#f3f2ef;--dim:#a4a6ad;--pink:#e8457a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Segoe UI",Helvetica,Arial,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .ui{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  #top{top:12px;left:50%;transform:translateX(-50%);padding:10px 12px;width:min(760px,calc(100vw - 24px));text-align:center}
  #top small{display:block;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-bottom:8px}
  #tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  #desc{margin:8px 0 0;color:var(--dim);font-size:13px;text-wrap:balance}
  button{font:inherit;color:var(--text);background:#26282e;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:#6a6d76}
  button[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
  #list{top:132px;left:12px;width:205px;padding:10px;max-height:calc(100vh - 220px);overflow:auto}
  #list h2,#card h2{margin:10px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
  #list h2:first-child,#card h2{margin-top:0}
  #list button{display:block;width:100%;text-align:left;margin:0 0 4px;padding:6px 9px;font-size:13px}
  #list button.on{background:#fff;color:#111;border-color:#fff;font-weight:600}
  #card{top:132px;right:12px;width:250px;padding:12px}
  #card img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#0e0f11;display:block;margin-bottom:10px}
  #card h3{margin:0 0 4px;font-size:18px}
  #card p{margin:0 0 10px;color:var(--dim);font-size:13px}
  #card a{display:block;text-align:center;background:var(--pink);color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:9px;margin-bottom:6px}
  #card button{width:100%}
  #modes{bottom:14px;left:50%;transform:translateX(-50%);padding:8px;display:flex;gap:6px;align-items:center}
  #hint{color:var(--dim);font-size:12px;padding:0 8px;max-width:42vw}
  #found{bottom:76px;left:50%;transform:translateX(-50%);padding:10px 14px;display:flex;gap:12px;align-items:center;border-color:var(--pink)}
  #load{inset:0;display:grid;place-items:center;border:0;border-radius:0;background:rgba(20,21,24,.86);font-size:15px;z-index:5}
  [hidden]{display:none!important}
  @media (max-width:760px){#list{display:none}#card{top:auto;bottom:76px;right:12px;left:12px;width:auto}#card img{display:none}#hint{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="ui">
  <small>ArchiWatts · one world · real models at true scale · mock 3</small>
  <div id="tabs"></div>
  <p id="desc"></p>
</div>

<div id="list" class="ui"></div>

<div id="card" class="ui" hidden>
  <h2>Selected</h2>
  <img id="cimg" alt="">
  <h3 id="cname"></h3>
  <p id="csite"></p>
  <a id="copen" href="#">Open project →</a>
  <button id="cback" type="button">Back to the world</button>
</div>

<div id="found" class="ui" hidden><span>You found <b id="fname"></b></span><button id="fopen" type="button">Look closer</button></div>

<div id="modes" class="ui">
  <button id="mOrbit" type="button" aria-pressed="true">Orbit</button>
  <button id="mWalk" type="button" aria-pressed="false">Walk</button>
  <button id="mCtx" type="button" aria-pressed="true">Site context</button>
  <span id="hint"></span>
</div>

<div id="load" class="ui">Loading models…</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const $ = id => document.getElementById(id);
const SEA = -.15, LAND = 1.2;   // world heights (m): sea surface, and the ground of pieces that are not on water

// Selectable projects. piece: which site piece it stands on.
const PROJECTS = [
  {name:'Venice Apartments', piece:'venice-apartments', group:'Real sites', url:'../interactive/venice-apartments/index.html', img:'../interactive/venice-apartments/preview.webp'},
  {name:'Allure Waterways', piece:'allure-waterways', group:'Real sites', note:'Docked off the Youth Center shore.', url:'../interactive/allure-waterways/index.html', img:'../interactive/allure-waterways/preview.webp'},
  {name:'Wheels on Water', piece:'wheels-on-water', group:'Real sites', note:'Moored at the Youth Center beach.', url:'../interactive/wheels-on-water/index.html', img:'../interactive/wheels-on-water/preview.webp'},
  {name:'Hive', piece:'hive', group:'Real sites', url:'../Hive/Hive.html', img:'../portfolio-assets/hive-card-model.webp'},
  {name:'North Beach Youth Center', piece:'north-beach-youth-center', group:'Real sites', url:'../interactive/north-beach-youth-center/index.html', img:'../interactive/north-beach-youth-center/preview.webp'},
  {name:'Winter Station 2027', piece:'beach', group:'Real sites', note:'Placeholder block on the beach next to the Youth Center.', url:'../interactive/winter-station-2027/index.html', img:'../interactive/winter-station-2027/preview.webp'},
  {name:'Net Zero School', piece:'net-zero-school', group:'Real sites', url:'../Net-Zero-School/Net-Zero-School.html', img:'../portfolio-assets/net-zero-school-review-cover.png'},
  {name:'Tranquil River', piece:'tranquil-river', group:'Real sites', url:'../Tranquil-River/Tranquil-River.html', img:'../portfolio-assets/tranquil-river-card-model.webp'},
  {name:'London Vertical Farm · Version 1', piece:'london-1', box:[-45,0,-45,45,159,45], group:'Real sites', note:'From the Revit model (Building Mass), on its piece of the Thames.', url:'../London-Vertical-Farm/story.html', img:''},
  {name:'London Vertical Farm · Version 2', piece:'london-2', box:[-105,0,-75,105,110,75], group:'Real sites', note:'From the Revit model (Building #2), on its piece of the Thames.', url:'../London-Vertical-Farm/story.html', img:''},
  {name:'Phalanstery', piece:'phalanstery', group:'Thought experiments', url:'../Phalanstery/Phalanstery.html', img:'../img/Phalanstery/renders/best-render-phalanstery-17.webp'},
  {name:'Museum of Emotions', piece:'museum-of-emotions', group:'Thought experiments', note:'Original.', url:'../interactive/museum-of-emotions/index.html', img:'../interactive/museum-of-emotions/preview.webp'},
  {name:'Museum of Emotions · Study 2', piece:'museum-study-2', group:'Thought experiments', url:'../interactive/museum-of-emotions/index.html?study=2', img:'../interactive/museum-of-emotions/studies/study-2/preview.webp'},
  {name:'Museum of Emotions · Study 3', piece:'museum-study-3', group:'Thought experiments', url:'../interactive/museum-of-emotions/index.html?study=3', img:'../interactive/museum-of-emotions/studies/study-3/preview.webp'}
];
const SHIPS = {'allure-waterways':1, 'wheels-on-water':1};

const LAYOUTS = {
  lagoon: {tab:'1 · Lagoon', desc:'One city where Net Zero School, Hive, the Youth Center, both London farms and the Tranquil River park blend into each other, tied together by one white promenade loop. Venice is its own island next door, the museums branch off it, and Phalanstery stands apart.'},
  city: {tab:'2 · Patchwork city', desc:'The site pieces are pushed together like a quilt, with only a street between them, so it reads as one continuous city made of your sites.'},
  banks: {tab:'3 · Two banks', desc:'One canal, two cities. Projects with real sites line the north bank, thought experiments line the south bank, and the ships sail between them.'}
};

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa9c3d1); scene.fog = new THREE.Fog(0xa9c3d1,3500,11000);
const camera = new THREE.PerspectiveCamera(45,1,2,30000);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f98,2.1));
const sun = new THREE.DirectionalLight(0xffffff,1.9); sun.position.set(.5,1,.35); scene.add(sun);
const std = (c,o={}) => new THREE.MeshStandardMaterial({color:c, roughness:.95, ...o});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(40000,40000), std(0x6f9bb3,{roughness:.6})); sea.rotation.x = -Math.PI/2; sea.position.y = SEA; scene.add(sea);
const links = new THREE.Group(); scene.add(links);
const ring = new THREE.Mesh(new THREE.RingGeometry(.96,1,96), new THREE.MeshBasicMaterial({color:0xe8457a, side:THREE.DoubleSide})); ring.rotation.x = -Math.PI/2; ring.visible = false; scene.add(ring);

function label(text){
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 112; const x = cv.getContext('2d');
  x.font = '600 42px system-ui,Segoe UI,Arial'; const w = Math.min(628, x.measureText(text).width + 56), l = (640-w)/2;
  x.fillStyle = 'rgba(20,21,24,.92)'; x.beginPath(); x.moveTo(l+28,12); x.arcTo(l+w,12,l+w,100,28); x.arcTo(l+w,100,l,100,28); x.arcTo(l,100,l,12,28); x.arcTo(l,12,l+w,12,28); x.fill();
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text,320,58,600);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false, transparent:true, sizeAttenuation:false})); s.scale.set(.2,.035,1); s.renderOrder = 10; return s;
}

// ---------- pieces ----------
const pieces = {}, contexts = [];
// City blending: [piece, radius of its territory (m), 1 if its own water must stay open (no shared ground under it)]
const CITY = [['hive',330,1],['net-zero-school',330,0],['north-beach-youth-center',280,0],['london-1',210,1],['london-2',230,1],['tranquil-river',75,0]];
const cityU = {cityA:{value:CITY.map(() => new THREE.Vector4())}, cityOn:{value:0}};
function cityMaterial(mat, own){   // own: index in CITY, or -1 for the shared ground
  mat.onBeforeCompile = sh => {
    sh.uniforms.cityA = cityU.cityA; sh.uniforms.cityOn = cityU.cityOn; sh.uniforms.cityOwn = {value:own};
    sh.vertexShader = 'varying vec3 vCityP;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n vCityP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = `varying vec3 vCityP; uniform vec4 cityA[${CITY.length}]; uniform float cityOn; uniform int cityOwn;
      float cw(vec2 p){ return sin(p.x*.019 + sin(p.y*.013)*1.9) + sin(p.y*.023 + sin(p.x*.011)*2.3); }\n` + sh.fragmentShader.replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
      if (cityOn > .5) { vec2 q = vCityP.xz + vec2(cw(vCityP.xz), cw(vCityP.zx + 57.)) * 16.; float best = 1e9; int bi = -1; float wet = 0.;
        for (int i = 0; i < ${CITY.length}; i++) { float d = length(q - cityA[i].xy) / cityA[i].z; if (d < best) { best = d; bi = i; wet = cityA[i].w; } }
        if (best > 1.) discard; if (cityOwn >= 0 && bi != cityOwn) discard; if (cityOwn < 0 && wet > .5) discard; }`);
  };
  mat.customProgramCacheKey = () => 'city'; return mat;
}
function piece(slug, w, d, o={}){
  const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner); scene.add(g);
  return pieces[slug] = {slug, w, d, g, inner, rot:0, sea:!!o.sea, ship:!!SHIPS[slug], project:o.project||null};
}
function slab(p, color=0xd9d6cf){ const m = new THREE.Mesh(new THREE.BoxGeometry(p.w,10,p.d), std(color)); m.position.y = -5.4; p.inner.add(m); p.slab = m; }
const block = (p,w,h,d,x,z,c=0xffffff) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), std(c)); m.position.set(x,h/2,z); p.inner.add(m); return m; };

async function load(){
  const manifest = await (await fetch('models/manifest.json?v=' + Date.now())).json();
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const slugs = Object.keys(manifest).filter(k => !k.startsWith('__')); let done = 0;
  await Promise.all(slugs.map(async slug => {
    const m = manifest[slug], p = piece(slug, m.w, m.d, {sea:m.sea, project:m.project});
    const gltf = await loader.loadAsync('models/' + slug + '.glb?v=' + m.kb);
    gltf.scene.traverse(o => { if (!o.isMesh) return;
      o.material.side = THREE.DoubleSide; if (!o.geometry.attributes.normal) o.material.flatShading = true;
      if (/^water/.test(o.name)) { o.material.roughness = .6; o.position.y += .02; }
      if (/^context/.test(o.name)) contexts.push(o);
      const ci = CITY.findIndex(c => c[0]===slug); if (ci >= 0) cityMaterial(o.material, ci);
    });
    p.inner.add(gltf.scene); if (!p.sea && !p.ship) slab(p);
    $('load').textContent = 'Loading models… ' + (++done) + ' / ' + slugs.length;
  }));
  // placeholders until the real models exist
  const nb = pieces['north-beach-youth-center'];
  const beach = piece('beach', 90, 260, {project:[-4,0,-1,4,3.5,1]}); slab(beach, 0xe6d8ae); block(beach,8,3.5,1.6,0,0);
  if (pieces['london-2']) return;   // placeholder only until the real Version 2 model is built
  const lo2 = piece('london-2', 150, 150, {project:[-45,0,-22,45,92,22]}); slab(lo2); block(lo2,110,8,60,0,0,0xcfd2d6); block(lo2,30,92,30,-28,0); block(lo2,30,70,30,28,0); block(lo2,26,4,18,0,0).position.y = 52;
  for (let i=1;i<7;i++){ block(lo2,34,1.2,34,-28,0,0xa9c49a).position.y = i*13; if (i<6) block(lo2,34,1.2,34,28,0,0xa9c49a).position.y = i*13; }
}

// ---------- layouts ----------
let rects = {}, layoutId = 'lagoon';
function arrange(id){
  layoutId = id; rects = {}; while (links.children.length) links.remove(links.children[0]);
  Object.values(pieces).forEach(p => p.rot = 0); pieces['allure-waterways'].rot = id==='lagoon' ? 0 : 1;
  const size = s => { const p = pieces[s]; return p.rot ? [p.d,p.w] : [p.w,p.d]; };
  const at = (s,x,z) => { const [w,d] = size(s); rects[s] = {x,z,w,d}; };
  const rel = (s,ref,side,gap=0,align='center') => {
    const [w,d] = size(s), r = rects[ref]; let x = r.x, z = r.z; const al = (c,rs,ss) => align==='start' ? c-rs/2+ss/2 : align==='end' ? c+rs/2-ss/2 : c;
    if (side==='right'){ x = r.x+r.w/2+gap+w/2; z = al(r.z,r.d,d); } else if (side==='left'){ x = r.x-r.w/2-gap-w/2; z = al(r.z,r.d,d); }
    else if (side==='below'){ z = r.z+r.d/2+gap+d/2; x = al(r.x,r.w,w); } else { z = r.z-r.d/2-gap-d/2; x = al(r.x,r.w,w); }
    rects[s] = {x,z,w,d};
  };
  const bridge = (a,b) => { const A = rects[a], B = rects[b], cl = (v,c,s) => Math.min(c+s/2,Math.max(c-s/2,v));
    let px = cl(B.x,A.x,A.w), pz = cl(B.z,A.z,A.d); const qx = cl(px,B.x,B.w), qz = cl(pz,B.z,B.d); px = cl(qx,A.x,A.w); pz = cl(qz,A.z,A.d); span(px,pz,qx,qz); };
  const span = (px,pz,qx,qz) => { const dx = qx-px, dz = qz-pz, len = Math.hypot(dx,dz)+16; const m = new THREE.Mesh(new THREE.BoxGeometry(len,1.2,9), std(0xffffff)); m.position.set((px+qx)/2,LAND-.5,(pz+qz)/2); m.rotation.y = -Math.atan2(dz,dx); links.add(m); };
  const fill = (x0,z0,x1,z1,color=0xd9d6cf,up=0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0),10,Math.abs(z1-z0)), std(color)); m.position.set((x0+x1)/2,LAND-5.45+up,(z0+z1)/2); links.add(m); };
  const lift = {}; cityU.cityOn.value = id==='lagoon' ? 1 : 0;
  let slabGrow = 0;

  if (id==='lagoon'){
    // The city: Net Zero School, Hive, the Youth Center, both London versions and the Tranquil River park, as overlapping site pieces.
    // Each piece is drawn only where its own project is the nearest one (CITY radii), so the sites meet along soft seams and share one coastline.
    at('hive',0,0); at('net-zero-school',-520,60); at('north-beach-youth-center',470,-40); at('london-1',-120,430); at('london-2',-380,-400);
    at('tranquil-river',150,285); lift['tranquil-river'] = LAND+.4;
    let bx0 = 1e9, bx1 = -1e9, bz0 = 1e9, bz1 = -1e9;
    CITY.forEach(([s,r,wet],i) => { const c = rects[s]; cityU.cityA.value[i].set(c.x,c.z,r,wet); bx0 = Math.min(bx0,c.x-r); bx1 = Math.max(bx1,c.x+r); bz0 = Math.min(bz0,c.z-r); bz1 = Math.max(bz1,c.z+r); });
    const base = new THREE.Mesh(new THREE.BoxGeometry(bx1-bx0+80,10,bz1-bz0+80), cityMaterial(std(0xd9d6cf),-1)); base.position.set((bx0+bx1)/2,LAND-5.4,(bz0+bz1)/2); links.add(base);   // shared ground
    const park = new THREE.Mesh(new THREE.CylinderGeometry(62,62,.3,48), std(0xb4cda4)); park.position.set(150,LAND-.22,285); links.add(park);
    const yc = rects['north-beach-youth-center']; at('beach',yc.x+262,yc.z); lift['beach'] = .5;                 // the beach on the Youth Center's outer shore
    rel('wheels-on-water','beach','right',12,'end'); rel('allure-waterways','beach','right',95,'start');   // boat and ship both dock there
    // Venice: only the island the apartments stand on
    at('venice-apartments',600,560);
    // Museum of Emotions branches off as its own island, with the two studies as smaller islands beside it
    rel('museum-of-emotions','venice-apartments','right',130,'start'); rel('museum-study-2','museum-of-emotions','right',50,'start'); rel('museum-study-3','museum-of-emotions','below',50,'start');
    // Phalanstery: separate, self-contained island, one bridge to the city
    at('phalanstery',330,-1230);
    span(300,-225,300,-712); span(560,212,560,372);
    // The promenade: one walking loop that passes every project in the city (a raised boardwalk where it crosses water)
    const loop = [[-300,-150],[-330,-290],[-120,-150],[60,-140],[260,-110],[430,-90],[680,-30],[560,40],[380,60],[240,200],[150,215],[40,300],[-70,360],[-200,330],[-300,220]];
    const curve = new THREE.CatmullRomCurve3(loop.map(([x,z]) => new THREE.Vector3(x,LAND+.7,z)), true, 'catmullrom', .5), N = 480, pos = [], idx = [];
    for (let i = 0; i <= N; i++){ const p = curve.getPointAt(i/N), t = curve.getTangentAt(i/N), nx = -t.z, nz = t.x, l = Math.hypot(nx,nz) || 1;
      pos.push(p.x+nx/l*4.5,p.y,p.z+nz/l*4.5, p.x-nx/l*4.5,p.y,p.z-nz/l*4.5); if (i < N) idx.push(i*2,i*2+1,i*2+2, i*2+1,i*2+3,i*2+2); }
    const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); pg.setIndex(idx); pg.computeVertexNormals();
    links.add(new THREE.Mesh(pg, std(0xffffff,{side:THREE.DoubleSide})));
    [['venice-apartments','museum-of-emotions'],['museum-of-emotions','museum-study-2'],['museum-of-emotions','museum-study-3']].forEach(([a,b]) => bridge(a,b));
  } else if (id==='city'){
    const S = 18; slabGrow = S;
    at('venice-apartments',0,0); rel('allure-waterways','venice-apartments','below',22); rel('wheels-on-water','allure-waterways','right',25,'end');
    rel('hive','venice-apartments','right',S,'start'); rel('north-beach-youth-center','hive','right',S,'start'); rel('beach','north-beach-youth-center','right',0);
    rel('net-zero-school','venice-apartments','left',S,'start'); rel('tranquil-river','net-zero-school','below',S,'end');
    rel('museum-of-emotions','venice-apartments','above',S,'start'); rel('museum-study-3','museum-of-emotions','right',S,'end'); rel('museum-study-2','hive','above',S,'start'); rel('london-1','museum-study-2','right',S,'end'); rel('london-2','london-1','right',S);
    rel('phalanstery','museum-of-emotions','above',S,'start');
  } else {
    const C = 90, gap = 30, row = (list,edge,dir) => { const tot = list.reduce((a,s) => a+size(s)[0],0)+gap*(list.length-1); let x = -tot/2; list.forEach(s => { const [w,d] = size(s); at(s,x+w/2,edge+dir*d/2); x += w+gap; }); };
    row(['net-zero-school','london-1','london-2','hive','venice-apartments','tranquil-river','north-beach-youth-center'],-C,-1); rel('beach','north-beach-youth-center','right',0);
    row(['museum-study-2','museum-of-emotions','phalanstery','museum-study-3'],C,1);
    at('allure-waterways',rects['venice-apartments'].x,-C+45); rel('wheels-on-water','allure-waterways','right',40,'end');
    [rects['hive'].x, rects['net-zero-school'].x, rects['north-beach-youth-center'].x].forEach(x => span(x,-C,x,C));
  }

  Object.values(pieces).forEach(p => { const r = rects[p.slug];
    p.g.position.set(r.x, (p.sea || p.ship ? 0 : LAND) + (lift[p.slug] || 0), r.z); p.inner.rotation.y = p.rot ? Math.PI/2 : 0;
    if (p.slab) p.slab.visible = !(id==='lagoon' && CITY.some(c => c[0]===p.slug));
    if (p.slab) p.slab.scale.set((p.w+slabGrow)/p.w,1,(p.d+slabGrow)/p.d);
  });
  PROJECTS.forEach(pr => { const p = pieces[pr.piece], b = pr.box || p.project || [-p.w/2,0,-p.d/2,p.w/2,10,p.d/2];
    let cx = (b[0]+b[3])/2, cz = (b[2]+b[5])/2, w = b[3]-b[0], d = b[5]-b[2]; if (p.rot){ [cx,cz] = [cz,-cx]; [w,d] = [d,w]; }
    pr.pos = new THREE.Vector3(p.g.position.x+cx, p.g.position.y, p.g.position.z+cz); pr.top = b[4]; pr.rad = Math.max(12, Math.hypot(w,d)/2);
    pr.label.position.set(pr.pos.x, pr.pos.y+b[4]+6, pr.pos.z); pr.hit.scale.set(Math.max(w,10),Math.max(b[4]-b[1],6),Math.max(d,10)); pr.hit.position.set(pr.pos.x, pr.pos.y+(b[4]+b[1])/2, pr.pos.z);
  });
  const xs = Object.values(rects); const x0 = Math.min(...xs.map(r => r.x-r.w/2)), x1 = Math.max(...xs.map(r => r.x+r.w/2)), z0 = Math.min(...xs.map(r => r.z-r.d/2)), z1 = Math.max(...xs.map(r => r.z+r.d/2));
  HOME.t.set((x0+x1)/2,0,(z0+z1)/2); HOME.r = Math.max(x1-x0,z1-z0)*1.2;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id===id)); $('desc').textContent = LAYOUTS[id].desc;
  select(-1); if (mode==='walk') startWalk();
}

// ---------- interaction ----------
let mode = 'orbit', selected = -1, near = -1;
const HOME = {t:new THREE.Vector3(), r:2500};
const o = {th:1.2, ph:.75, r:2500, t:new THREE.Vector3()}, g = {th:1.2, ph:.75, r:2500, t:new THREE.Vector3()};
const walk = {pos:new THREE.Vector3(), yaw:0, pitch:0}, keys = {};
window.__world = {view:g, home:HOME};   // for checking views from the console
// Top-down plan picture of a world rectangle (metres), saved by the local test server for the markup sheet
window.__world.plan = async (x0,z0,x1,z1,pxPerM,name) => {
  const w = Math.round((x1-x0)*pxPerM), h = Math.round((z1-z0)*pxPerM), cam = new THREE.OrthographicCamera((x0-x1)/2,(x1-x0)/2,(z1-z0)/2,(z0-z1)/2,1,8000);
  cam.position.set((x0+x1)/2,3000,(z0+z1)/2); cam.up.set(0,0,-1); cam.lookAt((x0+x1)/2,0,(z0+z1)/2);
  PROJECTS.forEach(p => p.label.visible = false); const rv = ring.visible, fog = scene.fog, pr = renderer.getPixelRatio(); ring.visible = false; scene.fog = null;
  renderer.setPixelRatio(1); renderer.setSize(w,h,false); renderer.render(scene,cam); const url = canvas.toDataURL('image/png');
  renderer.setPixelRatio(pr); resize(); scene.fog = fog; ring.visible = rv; PROJECTS.forEach(p => p.label.visible = true);
  await fetch('/__save?name=' + name, {method:'POST', body:url});
  return {w, h, projects:PROJECTS.map(p => [p.name, Math.round(p.pos.x), Math.round(p.pos.z)])};
};
const hits = new THREE.Group(); scene.add(hits);
const hitMat = new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false});

function select(i){
  selected = i; document.querySelectorAll('#list button').forEach((b,k) => b.classList.toggle('on', k===i));
  $('card').hidden = i<0; ring.visible = i>=0;
  if (i<0){ g.t.copy(HOME.t); g.r = HOME.r; g.ph = .75; return; }
  const pr = PROJECTS[i], p = pieces[pr.piece];
  $('cname').textContent = pr.name; $('copen').href = pr.url;
  $('csite').textContent = (pr.note ? pr.note + ' ' : '') + (p.ship ? 'True size: ' + Math.round(Math.max(p.w,p.d)) + ' m long.' : 'Site piece shown: ' + Math.round(p.w) + ' × ' + Math.round(p.d) + ' m.');
  const im = $('cimg'); im.hidden = !pr.img; im.onerror = () => im.hidden = true; if (pr.img) im.src = pr.img;
  ring.position.set(pr.pos.x, pr.pos.y+.6, pr.pos.z); ring.scale.setScalar(pr.rad*1.15);
  if (mode==='walk') setMode('orbit');
  g.t.set(pr.pos.x, pr.pos.y+pr.top*.3, pr.pos.z); g.r = Math.max(60, pr.rad*3.2); g.ph = 1.1;
}
function startWalk(){ const v = PROJECTS[0].pos; walk.pos.set(v.x+45, LAND+2, v.z+50); walk.yaw = .75; walk.pitch = 0;
  if (layoutId==='lagoon'){ walk.pos.set(60, LAND+2.4, -146); walk.yaw = Math.PI; } }   // in the city: start on the promenade, facing Hive
function setMode(m){
  mode = m; $('mOrbit').setAttribute('aria-pressed', m==='orbit'); $('mWalk').setAttribute('aria-pressed', m==='walk');
  $('hint').textContent = m==='orbit' ? 'Drag to orbit · Shift-drag to slide · scroll to zoom · click a project' : 'W A S D to move · drag to look · hold Shift to glide fast (the world is kilometres wide)';
  $('found').hidden = true; if (m==='walk'){ select(-1); mode = 'walk'; startWalk(); }
}

Object.entries(LAYOUTS).forEach(([id,L]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = L.tab; b.dataset.id = id; b.onclick = () => arrange(id); $('tabs').appendChild(b); });
let grp = '';
PROJECTS.forEach((pr,i) => { if (pr.group!==grp){ grp = pr.group; const h = document.createElement('h2'); h.textContent = grp; $('list').appendChild(h); } const b = document.createElement('button'); b.type = 'button'; b.textContent = pr.name; b.onclick = () => select(i); $('list').appendChild(b);
  pr.label = label(pr.name); scene.add(pr.label); pr.hit = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), hitMat); pr.hit.userData.pi = i; hits.add(pr.hit); });
$('cback').onclick = () => select(-1); $('mOrbit').onclick = () => setMode('orbit'); $('mWalk').onclick = () => setMode('walk');
$('mCtx').onclick = e => { const on = e.currentTarget.getAttribute('aria-pressed')!=='true'; contexts.forEach(c => c.visible = on); e.currentTarget.setAttribute('aria-pressed', on); };
$('fopen').onclick = () => { if (near>=0) select(near); };

let down = null, moved = 0; const ray = new THREE.Raycaster(), v2 = new THREE.Vector2();
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => { down = [e.clientX,e.clientY,e.shiftKey||e.button===2]; moved = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!down) return; const dx = e.clientX-down[0], dy = e.clientY-down[1]; down[0] = e.clientX; down[1] = e.clientY; moved += Math.abs(dx)+Math.abs(dy);
  if (mode==='walk'){ walk.yaw -= dx*.004; walk.pitch = Math.min(1.2, Math.max(-1.2, walk.pitch - dy*.004)); }
  else if (down[2]){ const k = g.r*.0016, s = Math.sin(g.th), c = Math.cos(g.th); g.t.x += (s*dx - c*dy)*k; g.t.z += (-c*dx - s*dy)*k; }
  else { g.th += dx*.006; g.ph = Math.min(1.5, Math.max(.12, g.ph - dy*.005)); }
});
canvas.addEventListener('pointerup', e => {
  if (down && moved<6){ v2.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(v2,camera);
    const h = ray.intersectObjects([...hits.children, ...PROJECTS.map(p => p.label)],false)[0]; select(h ? (h.object.userData.pi ?? PROJECTS.findIndex(p => p.label===h.object)) : -1); }
  down = null;
});
canvas.addEventListener('wheel', e => { e.preventDefault(); if (mode==='orbit') g.r = Math.min(9000, Math.max(30, g.r*(1+Math.sign(e.deltaY)*.14))); }, {passive:false});
addEventListener('keydown', e => { keys[e.code] = true; if (e.code==='Escape') select(-1); });
addEventListener('keyup', e => keys[e.code] = false);
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let last = performance.now();
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last = now;
  if (mode==='orbit'){
    const k = 1-Math.exp(-dt*5); o.th += (g.th-o.th)*k; o.ph += (g.ph-o.ph)*k; o.r += (g.r-o.r)*k; o.t.lerp(g.t,k);
    camera.position.set(o.t.x+o.r*Math.sin(o.ph)*Math.cos(o.th), o.t.y+o.r*Math.cos(o.ph), o.t.z+o.r*Math.sin(o.ph)*Math.sin(o.th)); camera.lookAt(o.t);
  } else {
    const f = (keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), s = (keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    const sp = (keys.ShiftLeft||keys.ShiftRight?90:9)*dt, sy = Math.sin(walk.yaw), cy = Math.cos(walk.yaw);
    walk.pos.x += (-sy*f + cy*s)*sp; walk.pos.z += (-cy*f - sy*s)*sp;
    camera.position.copy(walk.pos); camera.rotation.set(walk.pitch,walk.yaw,0,'YXZ');
    near = -1; let best = 1e9; PROJECTS.forEach((p,i) => { const d = Math.hypot(p.pos.x-walk.pos.x, p.pos.z-walk.pos.z) - p.rad; if (d<40 && d<best){ best = d; near = i; } });
    $('found').hidden = near<0; if (near>=0) $('fname').textContent = PROJECTS[near].name;
  }
  renderer.render(scene,camera); requestAnimationFrame(frame);
}

load().then(() => { arrange('lagoon'); o.t.copy(HOME.t); o.r = HOME.r*1.4; setMode('orbit'); $('load').hidden = true; requestAnimationFrame(frame); })
  .catch(e => { $('load').textContent = 'Could not load the models: ' + e.message; console.error(e); });
</script>
</body>
