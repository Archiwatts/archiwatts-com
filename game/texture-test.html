<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roof And Grass Test</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cdd9e2;font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;color:#1d1f2a}
  canvas{display:block}
  .tag{position:fixed;top:12px;padding:6px 10px;background:#fffffff0;border:1px solid #d9dbe6;border-radius:8px}
  #l{left:12px} #r{right:12px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="tag" id="l"><b>Before</b>: current game roof + grass</div>
<div class="tag" id="r"><b>After</b>: Spanish clay tiles (along the slope) + lush lawn, no visible tiling</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcdd9e2); scene.fog = new THREE.Fog(0xcdd9e2, 120, 420);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 1000); camera.position.set(0, 16, 38);
const fit = () => { const a = innerWidth / innerHeight, dist = 25 / (Math.tan(THREE.MathUtils.degToRad(21)) * Math.min(a, 1.6)); camera.position.set(0, dist * .38, dist); };   // keep both houses in view, even on a tall window
fit();
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 4, 0); controls.update();
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x6b6250, 1.1));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6); sun.position.set(-30, 45, 25); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-60, right:60, top:60, bottom:-60}); scene.add(sun);
const TL = new THREE.TextureLoader();
const tex = (url, srgb = true) => { const t = TL.load(url); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
const OLD = {roof: tex('../city/textures/roof.jpg'), roofN: tex('../city/textures/roof_n.jpg', false), grass: tex('../city/textures/grass.jpg')};
const NEW = {roof: tex('textures/roof_clay.jpg'), roofN: tex('textures/roof_clay_n.jpg', false), grass: tex('textures/grass_lawn.jpg'), grassN: tex('textures/grass_lawn_n.jpg', false)};

// hip roof over a w x d rectangle; UVs run along the eave (u) and down the slope (v), in metres, so tile rows follow every slope
function hipRoof(w, d, pitch, tile){
  const h = Math.min(w, d) / 2 * Math.tan(pitch), r = (Math.max(w, d) - Math.min(w, d)) / 2, long = w >= d;
  const A = [-w/2, 0, -d/2], B = [w/2, 0, -d/2], C = [w/2, 0, d/2], D = [-w/2, 0, d/2];
  const R1 = long ? [-r, h, 0] : [0, h, -r], R2 = long ? [r, h, 0] : [0, h, r];
  const faces = long ? [[A, B, R2, R1], [C, D, R1, R2], [B, C, R2], [D, A, R1]] : [[B, C, R2, R1], [D, A, R1, R2], [A, B, R1], [C, D, R2]];
  const pos = [], uv = [], idx = [];
  for (const f of faces){
    const e0 = new THREE.Vector3(...f[0]), e1 = new THREE.Vector3(...f[1]), along = e1.clone().sub(e0).normalize();
    const n = new THREE.Vector3().subVectors(e1, e0).cross(new THREE.Vector3(...f[2]).sub(e0)).normalize();
    const up = new THREE.Vector3().crossVectors(n, along).normalize(), base = pos.length / 3;
    for (const p of f){ const v = new THREE.Vector3(...p); pos.push(v.x, v.y, v.z); const q = v.clone().sub(e0); uv.push(q.dot(along) / tile, q.dot(up) / tile); }
    idx.push(base, base+1, base+2); if (f.length === 4) idx.push(base, base+2, base+3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
function house(x, T, newer){
  const g = new THREE.Group(); g.position.x = x; scene.add(g);
  const walls = new THREE.Mesh(new THREE.BoxGeometry(14, 7, 10), new THREE.MeshStandardMaterial({color: 0xf3dfc4, roughness: .9})); walls.position.y = 3.5; walls.castShadow = walls.receiveShadow = true; g.add(walls);
  const roofMat = new THREE.MeshStandardMaterial({map: T.roof, normalMap: T.roofN, roughness: .8, normalScale: new THREE.Vector2(1.2, 1.2), side: THREE.DoubleSide});
  const roof = new THREE.Mesh(hipRoof(15.6, 11.6, THREE.MathUtils.degToRad(26), newer ? 2.4 : 2), roofMat); roof.position.y = 7; roof.castShadow = roof.receiveShadow = true; g.add(roof);
  const fascia = new THREE.Mesh(new THREE.BoxGeometry(15.8, .45, 11.8), new THREE.MeshStandardMaterial({color: 0xfafaf6, roughness: .6})); fascia.position.y = 6.85; fascia.castShadow = true; g.add(fascia);
  const lawnMat = new THREE.MeshStandardMaterial({map: T.grass, normalMap: T.grassN || null, roughness: 1});
  if (newer){   // anti-tiling: two scales, one turned, mixed by slow noise, plus broad light / dry patches
    lawnMat.onBeforeCompile = sh => {
      sh.vertexShader = 'varying vec3 vW;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vW = (modelMatrix * vec4(transformed, 1.)).xyz;');
      sh.fragmentShader = 'varying vec3 vW;\nfloat nz(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); float a = fract(sin(dot(i, vec2(127.1,311.7)))*43758.5), b = fract(sin(dot(i+vec2(1,0), vec2(127.1,311.7)))*43758.5), c = fract(sin(dot(i+vec2(0,1), vec2(127.1,311.7)))*43758.5), d = fract(sin(dot(i+vec2(1,1), vec2(127.1,311.7)))*43758.5); return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }\n' +
        sh.fragmentShader.replace('#include <map_fragment>', `
          vec2 q = vW.xz; float m = smoothstep(.3, .7, nz(q * .045));
          vec3 g1 = texture2D(map, q / 3.1).rgb, g2 = texture2D(map, mat2(.8, -.6, .6, .8) * q / 7.3).rgb;
          vec3 g = mix(g1, g2, m) * mix(.82, 1.12, nz(q * .013 + 7.));
          g = mix(g, g * vec3(1.18, 1.05, .72), smoothstep(.62, .86, nz(q * .021 + 3.)) * .45);   // sun-dried patches
          diffuseColor.rgb *= g;`);
    };
  } else { T.grass.repeat.set(20, 20); }
  const lawn = new THREE.Mesh(new THREE.PlaneGeometry(23, 30), lawnMat); lawn.rotation.x = -Math.PI/2; lawn.receiveShadow = true; g.add(lawn);
  if (!newer) lawn.geometry.attributes.uv.array.forEach((v, i, a) => a[i] = v * 20 / 20);
}
house(-12, OLD, false); house(12, NEW, true);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); });
renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.__t = {camera, controls};
</script>
</body>
</html>
